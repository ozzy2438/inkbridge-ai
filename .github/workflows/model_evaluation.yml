name: Model Evaluation

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: Model version represented by the prediction artifact
        required: true
        type: string
      test_set:
        description: Versioned evaluation-set label
        required: true
        type: string
      prediction_run_id:
        description: Workflow run ID containing the evaluation-predictions artifact
        required: true
        type: string
      predictions_artifact_name:
        description: Artifact containing predictions.jsonl at its root
        required: true
        default: evaluation-predictions
        type: string
      baseline_run_id:
        description: Optional prior Model Evaluation run ID used as the release baseline
        required: false
        type: string
      baseline_artifact_name:
        description: Baseline evaluation-report artifact name
        required: false
        default: evaluation-report
        type: string

permissions:
  actions: read
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install evaluation dependencies
        run: pip install jiwer numpy pyyaml structlog

      - name: Download prediction artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.predictions_artifact_name }}
          path: prediction_artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.prediction_run_id }}

      - name: Download baseline evaluation artifact
        if: inputs.baseline_run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.baseline_artifact_name }}
          path: baseline_artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.baseline_run_id }}

      - name: Run evaluation and optional release gate
        env:
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          MODEL_VERSION: ${{ inputs.model_version }}
          TEST_SET: ${{ inputs.test_set }}
        run: |
          set -euo pipefail
          predictions="prediction_artifact/predictions.jsonl"
          test -f "$predictions"

          args=(
            --predictions "$predictions"
            --model-version "$MODEL_VERSION"
            --test-set "$TEST_SET"
            --output-dir evaluation_results
          )

          if [[ -n "$BASELINE_RUN_ID" ]]; then
            mapfile -t baseline_files < <(find baseline_artifact -type f -name 'eval_*.json')
            if [[ "${#baseline_files[@]}" -ne 1 ]]; then
              echo "Expected exactly one eval_*.json file in the baseline artifact" >&2
              exit 2
            fi
            args+=(--baseline-results "${baseline_files[0]}" --enforce-release-gate)
          fi

          python -m scripts.run_evaluation "${args[@]}"

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-report
          path: evaluation_results/
          if-no-files-found: error
          retention-days: 30
