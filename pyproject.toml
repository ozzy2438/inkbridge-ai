[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inkbridge-ai"
version = "0.1.0"
description = "Production Handwriting Intelligence & ModelOps Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Osman Orka", email = "osman@inkbridge.ai"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.40.0",
    "accelerate>=0.27.0",
    "peft>=0.9.0",
    "trl>=0.8.0",
    "datasets>=2.18.0",
    "evaluate>=0.4.0",
    "jiwer>=3.0.0",
    "onnxruntime>=1.17.0",
    "optimum>=1.17.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "boto3>=1.34.0",
    "Pillow>=10.2.0",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "python-docx>=1.1.0",
    "PyPDF2>=3.0.0",
    "pdf2image>=1.17.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "sentry-sdk>=1.40.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "black>=24.1.0",
    "pre-commit>=3.6.0",
    "jupyter>=1.0.0",
    "ipywidgets>=8.1.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]
gpu = [
    "onnxruntime-gpu>=1.17.0",
    "tensorrt>=8.6.0",
]
labeling = [
    "label-studio-sdk>=0.0.34",
    "label-studio-ml>=2.0.0",
]

[project.scripts]
inkbridge = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."] 

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=html --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
no_site_packages = true
