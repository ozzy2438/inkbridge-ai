# Evaluation Configuration
evaluation:
  # Gold test set (locked, never used in training)
  gold_test_set: "./data/gold_test/"
  
  # Metrics to compute
  metrics:
    text_recognition:
      - cer
      - wer
      - normalized_edit_distance
    
    layout:
      - region_f1
      - reading_order_accuracy
      - paragraph_break_fidelity
    
    reliability:
      - calibration_error
      - false_confidence_rate
      - abstention_precision
    
    operations:
      - correction_minutes_per_page
      - auto_accept_rate
    
    production:
      - p50_latency_ms
      - p95_latency_ms
      - pages_per_minute
      - cost_per_page_usd
    
    edge_cases:
      - blur_cer
      - cursive_cer
      - crossout_cer
      - faint_pencil_cer
      - insertion_cer

  # Model release gate
  release_gate:
    # Must improve on gold set
    min_cer_improvement: 0.005  # At least 0.5% absolute improvement
    
    # No slice regression beyond threshold
    max_slice_regression: 0.02  # No slice can get 2%+ worse
    
    # Output validity
    min_valid_output_rate: 1.0  # 100% valid JSON output
    
    # Latency limits
    max_p95_latency_ms: 5000  # 5 seconds per page
    
    # Hallucination control
    max_false_confidence_rate: 0.05  # <5% high-confidence errors
    
    # Cost limit
    max_cost_per_page_usd: 0.05

  # Failure Atlas categories
  failure_categories:
    - faint_pencil
    - severe_perspective
    - joined_cursive
    - touching_lines
    - crossed_out
    - margin_insertion
    - mixed_print_handwriting
    - teacher_annotation
    - missing_page_edge
    - repeated_page
    - blank_page
    - diagram_non_text
    - low_contrast
    - heavy_blur
    - jpeg_artifacts

  # Benchmark comparison
  baselines:
    - name: "tesseract_5"
      description: "Tesseract 5 OCR baseline"
    - name: "trocr_pretrained"
      description: "TrOCR base handwritten (no fine-tuning)"
    - name: "vlm_zero_shot"
      description: "VLM zero-shot transcription"
